<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: transparent;
    --user-bg: #007AFF;
    --user-fg: #fff;
    --assistant-fg: #1d1d1f;
    --muted: #8e8e93;
    --code-bg: rgba(127,127,127,0.14);
    --pre-bg: rgba(127,127,127,0.1);
    --border: rgba(127,127,127,0.25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --user-bg: #0A84FF;
      --assistant-fg: #f5f5f7;
      --muted: #98989d;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--assistant-fg);
  }
  #log {
    padding: 10px 10px 16px;
    display: flex;
    flex-direction: column; /* 旧→新从上往下；禁止 column-reverse */
    justify-content: flex-start;
    gap: 12px;
    min-height: 100%;
    box-sizing: border-box;
  }
  .row { display: flex; width: 100%; }
  .row.user { justify-content: flex-end; }
  .row.assistant, .row.system { justify-content: flex-start; }
  .bubble {
    max-width: 88%;
    padding: 8px 12px;
    border-radius: 16px 16px 4px 16px;
    background: var(--user-bg);
    color: var(--user-fg);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-text { white-space: pre-wrap; word-break: break-word; }
  .bubble-images {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .bubble-images + .bubble-text { margin-top: 8px; }
  .bubble-text:first-child { margin-top: 0; }
  .bubble-img {
    display: block;
    max-width: min(260px, 100%);
    max-height: 220px;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
    background: rgba(255,255,255,0.18);
    cursor: pointer;
  }
  .bubble-img:hover { outline: 2px solid rgba(255,255,255,0.55); outline-offset: 1px; }
  .bubble-img-single {
    max-width: min(280px, 100%);
    max-height: 240px;
  }
  .bubble-files {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bubble-files + .bubble-text,
  .bubble-images + .bubble-files { margin-top: 8px; }
  .bubble-file {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.16);
    cursor: pointer;
    max-width: 100%;
    border: 0;
    color: inherit;
    font: inherit;
    text-align: left;
  }
  .bubble-file:hover { background: rgba(255,255,255,0.26); }
  .bubble-file-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 auto;
    border-radius: 5px;
    object-fit: contain;
    background: rgba(255,255,255,0.2);
  }
  .bubble-file-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    line-height: 1.3;
  }
  .bubble-file-hint {
    flex: 0 0 auto;
    opacity: 0.75;
    font-size: 11px;
  }
  .assistant-body {
    max-width: 100%;
    color: var(--assistant-fg);
    word-break: break-word;
  }
  .assistant-body > *:first-child { margin-top: 0; }
  .assistant-body > *:last-child { margin-bottom: 0; }
  .assistant-body h1 { font-size: 1.25em; margin: 0.75em 0 0.4em; font-weight: 700; }
  .assistant-body h2 { font-size: 1.15em; margin: 0.7em 0 0.35em; font-weight: 650; }
  .assistant-body h3,
  .assistant-body h4 { font-size: 1.05em; margin: 0.6em 0 0.3em; font-weight: 600; }
  .assistant-body p { margin: 0.5em 0; white-space: pre-wrap; }
  .assistant-body ul, .assistant-body ol { margin: 0.45em 0; padding-left: 1.4em; }
  .assistant-body li { margin: 0.2em 0; }
  .assistant-body li > p { margin: 0.15em 0; }
  .assistant-body strong { font-weight: 700; }
  .assistant-body em { font-style: italic; }
  .assistant-body code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 0.92em;
    background: var(--code-bg);
    padding: 0.12em 0.4em;
    border-radius: 4px;
  }
  .assistant-body pre {
    background: var(--pre-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    overflow-x: auto;
    margin: 0.55em 0;
  }
  .assistant-body pre code {
    background: none; padding: 0; border-radius: 0;
    white-space: pre;
  }
  .assistant-body blockquote {
    margin: 0.5em 0; padding: 0.15em 0 0.15em 0.8em;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .assistant-body a { color: var(--user-bg); }
  .assistant-body hr {
    border: none; border-top: 1px solid var(--border); margin: 0.8em 0;
  }
  .assistant-body table {
    border-collapse: collapse;
    margin: 0.55em 0;
    width: 100%;
    font-size: 0.95em;
  }
  .assistant-body th, .assistant-body td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    text-align: left;
  }
  .assistant-body th { background: var(--code-bg); font-weight: 600; }
  .system-body {
    max-width: 100%;
    color: var(--muted);
    font-size: 12px;
    white-space: pre-wrap;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 24px 12px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div id="log"><div class="empty" id="empty">开始对话吧</div></div>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /**
   * Markdown → HTML
   * 顺序：保护 code fence / 行内 code → 块级解析 → 行内格式 → 还原占位符
   * 避免先插入 HTML 再 esc() 导致格式丢失。
   */
  function mdToHtml(src) {
    var raw = String(src == null ? '' : src).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (!raw.length) return '<p></p>';

    var slots = [];
    function park(html) {
      var i = slots.length;
      slots.push(html);
      return '%%MEO' + i + '%%';
    }
    function unpark(s) {
      return String(s).replace(/%%MEO(\d+)%%/g, function (_, n) {
        return slots[Number(n)] || '';
      });
    }

    // 1) fenced code ```
    raw = raw.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      return park('<pre><code>' + esc(String(code).replace(/\n$/, '')) + '</code></pre>');
    });
    // ~~~ fences
    raw = raw.replace(/~~~([^\n]*)\n?([\s\S]*?)~~~/g, function (_, lang, code) {
      return park('<pre><code>' + esc(String(code).replace(/\n$/, '')) + '</code></pre>');
    });
    // 2) inline code — 占位，稍后不经 esc 破坏
    raw = raw.replace(/`([^`\n]+)`/g, function (_, code) {
      return park('<code>' + esc(code) + '</code>');
    });

    function inlineFormat(s) {
      // 此时仍可能含 %%MEO%% 占位；先 esc 普通文本，再套格式，最后 unpark
      var parts = String(s).split(/(%%MEO\d+%%)/g);
      for (var i = 0; i < parts.length; i++) {
        if (/^%%MEO\d+%%$/.test(parts[i])) continue;
        var t = esc(parts[i]);
        // 图片 ![alt](url)
        t = t.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img alt="$1" src="$2" style="max-width:100%;border-radius:6px" />');
        // 链接
        t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        // 粗体 ** ** __ __
        t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        // 删除线
        t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        // 斜体 * * _ _（避免吃掉已处理的 **）
        t = t.replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
        t = t.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
        parts[i] = t;
      }
      return unpark(parts.join(''));
    }

    var lines = raw.split('\n');
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:|-]+\|[\s:|-]+\|?\s*$/.test(line) && /\|/.test(line) && /-/.test(line);
    }
    function splitRow(line) {
      var s = line.trim();
      if (s.charAt(0) === '|') s = s.slice(1);
      if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
      return s.split('|').map(function (c) { return c.trim(); });
    }

    while (i < lines.length) {
      var line = lines[i];

      // 已保护的整块（fence）
      if (/^\s*%%MEO\d+%%\s*$/.test(line)) {
        out.push(unpark(line.trim()));
        i++;
        continue;
      }

      if (/^\s*$/.test(line)) {
        i++;
        continue;
      }

      if (/^\s*(?:---|\*\*\*|___)\s*$/.test(line)) {
        out.push('<hr/>');
        i++;
        continue;
      }

      var hm = line.match(/^\s*(#{1,6})\s*(.+?)\s*$/);
      if (hm) {
        var lvl = Math.min(hm[1].length, 4);
        out.push('<h' + lvl + '>' + inlineFormat(hm[2]) + '</h' + lvl + '>');
        i++;
        continue;
      }

      // GFM table
      if (i + 1 < lines.length && /\|/.test(line) && isTableSep(lines[i + 1])) {
        var heads = splitRow(line);
        i += 2;
        var bodyRows = [];
        while (i < lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])) {
          bodyRows.push(splitRow(lines[i]));
          i++;
        }
        var html = '<table><thead><tr>';
        heads.forEach(function (h) { html += '<th>' + inlineFormat(h) + '</th>'; });
        html += '</tr></thead><tbody>';
        bodyRows.forEach(function (row) {
          html += '<tr>';
          for (var c = 0; c < heads.length; c++) {
            html += '<td>' + inlineFormat(row[c] || '') + '</td>';
          }
          html += '</tr>';
        });
        html += '</tbody></table>';
        out.push(html);
        continue;
      }

      var bq = line.match(/^\s{0,3}>\s?(.*)$/);
      if (bq) {
        var bqlines = [bq[1]];
        i++;
        while (i < lines.length) {
          var bm = lines[i].match(/^\s{0,3}>\s?(.*)$/);
          if (!bm) break;
          bqlines.push(bm[1]);
          i++;
        }
        out.push('<blockquote><p>' + inlineFormat(bqlines.join('\n')) + '</p></blockquote>');
        continue;
      }

      // 无序：- * + • · －
      var ul = line.match(/^\s{0,3}([-*+•·－])\s+(.+)$/);
      if (ul) {
        var items = [ul[2]];
        i++;
        while (i < lines.length) {
          var um = lines[i].match(/^\s{0,3}([-*+•·－])\s+(.+)$/);
          if (!um) break;
          items.push(um[2]);
          i++;
        }
        out.push('<ul>' + items.map(function (it) {
          return '<li>' + inlineFormat(it) + '</li>';
        }).join('') + '</ul>');
        continue;
      }

      // 有序：1. 1、 1)
      var ol = line.match(/^\s{0,3}(\d+)([.、)])\s+(.+)$/);
      if (ol) {
        var oitems = [ol[3]];
        i++;
        while (i < lines.length) {
          var om = lines[i].match(/^\s{0,3}(\d+)([.、)])\s+(.+)$/);
          if (!om) break;
          oitems.push(om[3]);
          i++;
        }
        out.push('<ol>' + oitems.map(function (it) {
          return '<li>' + inlineFormat(it) + '</li>';
        }).join('') + '</ol>');
        continue;
      }

      // 段落：吃到空行或下一块
      var para = [line];
      i++;
      while (i < lines.length) {
        var n = lines[i];
        if (/^\s*$/.test(n)) break;
        if (/^\s*%%MEO\d+%%\s*$/.test(n)) break;
        if (/^\s*(#{1,6})\s*/.test(n)) break;
        if (/^\s{0,3}>\s?/.test(n)) break;
        if (/^\s{0,3}([-*+•·－])\s+/.test(n)) break;
        if (/^\s{0,3}\d+[.、)]\s+/.test(n)) break;
        if (/^\s*(?:---|\*\*\*|___)\s*$/.test(n)) break;
        if (i + 1 < lines.length && /\|/.test(n) && isTableSep(lines[i + 1])) break;
        para.push(n);
        i++;
      }
      out.push('<p>' + inlineFormat(para.join('\n')) + '</p>');
    }

    return out.join('') || '<p></p>';
  }

  function looksLikeHtml(s) {
    var t = String(s || '').trim();
    return (
      t.charAt(0) === '<' &&
      /<\/?[a-z][\s\S]*>/i.test(t) &&
      /<(p|div|h[1-6]|table|ul|ol|li|br|pre|blockquote|span|strong)\b/i.test(t)
    );
  }

  function sanitizeHtml(html) {
    var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(function (n) {
      n.remove();
    });
    doc.querySelectorAll('*').forEach(function (el) {
      Array.prototype.slice.call(el.attributes || []).forEach(function (a) {
        var name = a.name || '';
        var val = a.value || '';
        if (/^on/i.test(name) || (name === 'href' && /^\s*javascript:/i.test(val))) {
          el.removeAttribute(name);
        }
      });
    });
    return doc.body ? doc.body.innerHTML : '';
  }

  function ensureLog() {
    var empty = document.getElementById('empty');
    if (empty) empty.remove();
    return document.getElementById('log');
  }

  function scrollBottom() {
    requestAnimationFrame(function () {
      var log = document.getElementById('log');
      var last = log && log.lastElementChild;
      if (last && typeof last.scrollIntoView === 'function') {
        last.scrollIntoView({ block: 'end', inline: 'nearest' });
      }
      var h = Math.max(
        document.body ? document.body.scrollHeight : 0,
        document.documentElement ? document.documentElement.scrollHeight : 0
      );
      window.scrollTo(0, h);
    });
  }

  function postNative(payload) {
    try {
      if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.meoAIChat) {
        webkit.messageHandlers.meoAIChat.postMessage(payload);
      }
    } catch (e) {}
  }

  function openAttachment(path, dataURL) {
    if (path) {
      postNative({ action: 'openPath', path: String(path) });
      return;
    }
    if (dataURL && String(dataURL).indexOf('data:image') === 0) {
      postNative({ action: 'openImageData', dataURL: String(dataURL) });
    }
  }

  function normalizeImages(images) {
    var out = [];
    (Array.isArray(images) ? images : []).forEach(function (item) {
      if (typeof item === 'string') {
        if (item.indexOf('data:image') === 0) out.push({ src: item, path: '' });
        return;
      }
      if (!item || typeof item !== 'object') return;
      var src = String(item.src || item.preview || '');
      if (src.indexOf('data:image') !== 0) return;
      out.push({ src: src, path: String(item.path || '') });
    });
    return out;
  }

  function appendBubbleImages(bubble, images) {
    var imgs = normalizeImages(images);
    if (!imgs.length) return 0;
    var gallery = document.createElement('div');
    gallery.className = 'bubble-images';
    imgs.forEach(function (it) {
      var img = document.createElement('img');
      img.className = 'bubble-img';
      img.src = it.src;
      img.alt = '图片附件';
      img.title = '点击用系统应用打开';
      img.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        openAttachment(it.path, it.src);
      });
      gallery.appendChild(img);
    });
    if (imgs.length === 1 && gallery.firstElementChild) {
      gallery.firstElementChild.classList.add('bubble-img-single');
    }
    bubble.appendChild(gallery);
    return imgs.length;
  }

  function appendBubbleFiles(bubble, files) {
    var list = Array.isArray(files) ? files : [];
    if (!list.length) return 0;
    var wrap = document.createElement('div');
    wrap.className = 'bubble-files';
    var n = 0;
    list.forEach(function (f) {
      if (!f || typeof f !== 'object') return;
      var name = String(f.name || '文件');
      var path = String(f.path || '');
      var icon = String(f.icon || '');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'bubble-file';
      btn.title = path ? ('打开 ' + name) : name;
      if (icon.indexOf('data:image') === 0) {
        var ic = document.createElement('img');
        ic.className = 'bubble-file-icon';
        ic.src = icon;
        ic.alt = '';
        btn.appendChild(ic);
      } else {
        var ph = document.createElement('div');
        ph.className = 'bubble-file-icon';
        btn.appendChild(ph);
      }
      var label = document.createElement('div');
      label.className = 'bubble-file-name';
      label.textContent = name;
      btn.appendChild(label);
      var hint = document.createElement('div');
      hint.className = 'bubble-file-hint';
      hint.textContent = '打开';
      btn.appendChild(hint);
      btn.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (path) openAttachment(path, '');
      });
      wrap.appendChild(btn);
      n += 1;
    });
    if (n) bubble.appendChild(wrap);
    return n;
  }

  function appendRow(role, text, images, files) {
    var log = ensureLog();
    var row = document.createElement('div');
    var src = text == null ? '' : String(text);
    if (role === 'assistant') {
      row.className = 'row assistant';
      var body = document.createElement('div');
      body.className = 'assistant-body';
      try {
        if (looksLikeHtml(src)) {
          body.innerHTML = sanitizeHtml(src);
        } else {
          body.innerHTML = mdToHtml(src);
        }
      } catch (e) {
        body.textContent = src;
      }
      row.appendChild(body);
    } else if (role === 'system') {
      row.className = 'row system';
      var sys = document.createElement('div');
      sys.className = 'system-body';
      sys.textContent = src;
      row.appendChild(sys);
    } else {
      row.className = 'row user';
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      var imgN = appendBubbleImages(bubble, images);
      var fileN = appendBubbleFiles(bubble, files);
      if (src.length) {
        var t = document.createElement('div');
        t.className = 'bubble-text';
        t.textContent = src;
        bubble.appendChild(t);
      }
      if (!bubble.childNodes.length) {
        var empty = document.createElement('div');
        empty.className = 'bubble-text';
        empty.textContent = imgN || fileN ? '（附件）' : '（空）';
        bubble.appendChild(empty);
      }
      row.appendChild(bubble);
    }
    log.appendChild(row);
    scrollBottom();
  }

  window.MeoAIChat = {
    clear: function () {
      var log = document.getElementById('log');
      log.innerHTML = '<div class="empty" id="empty">开始对话吧</div>';
    },
    appendUser: function (text) { appendRow('user', text); },
    appendUserPayload: function (obj) {
      var o = obj || {};
      appendRow('user', o.text || '', o.images || [], o.files || []);
    },
    appendAssistant: function (markdown) { appendRow('assistant', markdown); },
    appendSystem: function (text) { appendRow('system', text); },
    setMessages: function (items) {
      var log = document.getElementById('log');
      log.innerHTML = '';
      var list = Array.isArray(items) ? items : [];
      if (list.length === 0) {
        log.innerHTML = '<div class="empty" id="empty">开始对话吧</div>';
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var it = list[i] || {};
        appendRow(it.role || 'user', it.content || '', it.images || [], it.files || []);
      }
      scrollBottom();
    },
    debugRender: function (markdown) {
      return mdToHtml(markdown);
    }
  };
})();
</script>
</body>
</html>
