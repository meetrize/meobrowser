<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>站点备忘测试页</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 520px; margin: 48px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; color: #555; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; }
    textarea { min-height: 96px; resize: vertical; }
    button { margin-top: 12px; margin-right: 8px; padding: 8px 16px; font-size: 14px; }
    #status { margin-top: 20px; color: #0a7; font-weight: 600; white-space: pre-wrap; }
    .hint { color: #888; font-size: 12px; line-height: 1.5; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>站点备忘测试</h1>
  <p class="hint">本页<strong>没有</strong>密码框。主机填 <code>file</code>，路径前缀可用 <code>form-memo-test.html</code>。</p>
  <p class="hint">建议字段：工号 <code>#employeeId</code>、姓名 <code>#fullName</code>、现象描述 <code>#description</code>。</p>
  <p class="hint"><b>P2 内联：</b>输入内容后右侧出现「＋」可保存；若本页已有备忘，已配置字段右侧会出现「↓」，点击一键填入全部字段。</p>

  <form id="ticketForm" onsubmit="return preview(event)">
    <label for="employeeId">工号</label>
    <input id="employeeId" name="employeeId" type="text" />

    <label for="fullName">姓名</label>
    <input id="fullName" name="fullName" type="text" />

    <label for="description">现象描述</label>
    <textarea id="description" name="description"></textarea>

    <button type="submit">预览（不会真提交）</button>
    <button type="button" onclick="clearForm()">清空</button>
  </form>

  <div id="status"></div>
  <script>
    function preview(event) {
      event.preventDefault();
      var emp = document.getElementById('employeeId').value;
      var name = document.getElementById('fullName').value;
      var desc = document.getElementById('description').value;
      document.getElementById('status').textContent =
        '预览：\n工号=' + emp + '\n姓名=' + name + '\n描述=' + desc;
      return false;
    }
    function clearForm() {
      document.getElementById('employeeId').value = '';
      document.getElementById('fullName').value = '';
      document.getElementById('description').value = '';
      document.getElementById('status').textContent = '';
    }
  </script>
</body>
</html>
