# Meo PocketBase — 宝塔 / nginx 反代示例（对外 :8090）
# 放到：/www/server/panel/vhost/nginx/meo-pocketbase.conf
# PocketBase 本机监听：127.0.0.1:18090
# 作用：高性能反代 + 注入 meo-auth-guard.js（登录失效回登录页）

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 64m;

    location = /meo-auth-guard.js {
        alias /opt/meo-pocketbase/static/meo-auth-guard.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;

        # sub_filter 需要上游不压缩
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/meo-auth-guard.js"></script></head>';
        sub_filter_once on;
    }
}
